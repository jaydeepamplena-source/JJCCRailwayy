<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Train results | JJCC Railways</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@600;700&family=Playfair+Display:wght@700&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="results" data-active="book" data-steps="results">
  <div id="site-header"></div>

  <main class="wrap wrap-md section">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="book.html">Search</a><span>&rsaquo;</span><span>Train results</span></nav>

    <div class="results-head">
      <div>
        <h1 class="route-title" id="routeTitle"></h1>
        <p class="muted" id="routeMeta"></p>
      </div>
      <a class="btn-outline" id="modifyBtn" href="book.html">Modify search</a>
    </div>

    <div class="results-grid">
      <aside class="filter" aria-label="Filter and sort">
        <h2>Filter &amp; Sort</h2>
        <fieldset>
          <legend>Changes</legend>
          <label><input type="radio" name="changes" value="all" checked /> All services</label>
          <label><input type="radio" name="changes" value="direct" /> Direct only</label>
          <label><input type="radio" name="changes" value="one" /> 1 change</label>
        </fieldset>
        <fieldset>
          <legend>Sort by</legend>
          <label><input type="radio" name="sort" value="dep" checked /> Departure time</label>
          <label><input type="radio" name="sort" value="price" /> Lowest price</label>
          <label><input type="radio" name="sort" value="fast" /> Fastest</label>
        </fieldset>
      </aside>

      <section aria-label="Results">
        <p class="count" id="resultCount" aria-live="polite"></p>
        <div id="serviceList"></div>
      </section>
    </div>
  </main>

  <div class="modal" id="selectModal" hidden></div>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
