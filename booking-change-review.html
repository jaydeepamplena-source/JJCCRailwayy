<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Change Review | JJCC Railways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@600;700&family=Playfair+Display:wght@700&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>:root{--navy:#102044;--cream:#f5f3ee;--ink:#172440;--muted:#77766f;--line:#e5e3de}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}header{background:var(--navy);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:Oswald,Inter,sans-serif;letter-spacing:.03em}header a{color:white}main{max-width:1200px;width:92%;margin:30px auto}h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;color:var(--navy)}.panel,.request{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}select,textarea,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:7px}button{cursor:pointer;font-weight:700}.approve{background:#187443;color:white}.reject{background:#a52c2c;color:white}.open{background:var(--navy);color:white}.request{margin:14px 0}.muted,small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.request textarea{width:100%;min-height:65px;margin-top:10px}.notice{padding:12px;background:#fff2d7;border-radius:7px;margin:12px 0}.error{background:#fde8e7;color:#a52c2c}.details{margin:10px 0;padding:12px;background:#f7f6f2;border-radius:8px;white-space:pre-wrap}</style></head>
<body><header><strong>JJCC RAILWAYS | BOOKING CHANGE REVIEW</strong><a id="backDash" href="admin.html">Back to Dashboard</a></header>
<main><h1>Booking Change Requests</h1><p class="muted">Review the combined change request and one receipt. Approve or reject the entire request as one transaction.</p>
<section class="panel"><div class="toolbar"><select id="bcrFilter"><option value="pending_review">Pending review</option><option value="all">All requests</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="expired">Expired</option></select><button id="bcrRefresh">Refresh</button></div><p id="bcrMessage" class="notice">Loading…</p><div id="bcrList"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="booking-change-review.js"></script></body></html>
