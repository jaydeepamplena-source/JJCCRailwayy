<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookings | JJCC Railways</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@600;700&family=Playfair+Display:wght@700&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Status filters and Travel History alignment */
    .booking-filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      width: 100%;
      margin: 16px 0 20px;
    }

    .booking-view-tabs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
    }

.travel-history-link {
  flex-shrink: 0;
  align-self: center;
  display: inline-block;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: var(--navy);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 0;
  cursor: pointer;

  /* Permanent underline */
  text-decoration: underline;
  text-underline-offset: 5px;
  text-decoration-thickness: 2px;
}

/* Booking action buttons */
.ab-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
}

.ab-actions .ab-action-btn,
.ab-actions .ab-secondary {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  vertical-align: middle;
  min-height: 48px;
  padding: 0 20px;
  box-sizing: border-box;
  line-height: 1.2;
  text-decoration: none;
}

@media (max-width: 650px) {
  .ab-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .ab-actions .ab-action-btn,
  .ab-actions .ab-secondary {
    width: 100%;
  }

  .booking-filter-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }

  .travel-history-link {
    align-self: flex-end;
  }
}

@media (max-width: 650px) {
  .ab-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .ab-actions .ab-action-btn,
  .ab-actions .ab-secondary {
    width: 100%;
  }
}

/* Status filters and Travel History alignment */
.booking-filter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  width: 100%;
  margin: 16px 0 20px;
}

.booking-view-tabs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
}

.travel-history-link {
  flex-shrink: 0;
  align-self: center;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--navy);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 0;
  cursor: pointer;
  text-decoration: none;
  position: relative;
}

.travel-history-link.is-active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 2px;
  height: 2px;
  background: var(--gold);
}

@media (max-width: 650px) {
  .booking-filter-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }

  .travel-history-link {
    align-self: flex-end;
  }
}



/* Booking filters and Travel History */
#bookingViewTabs {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  width: 100%;
  gap: 16px;
}

.booking-status-filters {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.travel-history-link {
  display: inline-block;
  flex-shrink: 0;
  padding: 9px 0;
  margin-left: auto;
  color: var(--navy);
  font-size: 13px;
  font-weight: 700;
  text-decoration: underline !important;
  text-underline-offset: 5px;
  text-decoration-thickness: 1px;
  background: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  cursor: pointer;
}

.travel-history-link:hover,
.travel-history-link.is-active {
  color: var(--gold);
  text-decoration: underline !important;
}

@media (max-width: 650px) {
  #bookingViewTabs {
    align-items: flex-start;
  }

  .travel-history-link {
    margin-left: auto;
  }
}

  </style>
  <style>
    /* Page-specific layout using the JJCC Railways shared design tokens. */
    .active-bookings-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .active-bookings-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .active-bookings-tools .inp {
      flex: 1;
      min-width: 220px;
    }

    .active-bookings-count {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 13px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .active-booking-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .ab-booked-at {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .ab-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .ab-eyebrow {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      margin-bottom: 5px;
    }

    .ab-reference {
      color: var(--navy);
      font-family: var(--font-mono);
      font-size: 17px;
    }

    .ab-status {
      display: inline-block;
      background: #e8f2e9;
      color: #24643a;
      border-radius: 30px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .ab-route {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
      padding: 20px 0;
    }

    .ab-route strong {
      display: block;
      color: var(--navy);
      font-size: 17px;
    }

    .ab-route small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .ab-route-arrow {
      color: var(--gold);
      font-size: 23px;
      font-weight: 700;
    }

    .ab-details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .ab-details span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .ab-details strong {
      color: var(--ink);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .ab-passenger-section {
      margin-top: 18px;
    }

    .ab-passenger-section h3 {
      color: var(--navy);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .ab-passenger {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .ab-passenger span:last-child {
      color: var(--muted);
      text-align: right;
    }

    .ab-actions btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 60px;
      line-height: 1;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .ab-actions .btn-primary,
    .ab-actions .btn-outline,
    .ab-actions .ab-secondary {
  display: inline-flex !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center !important;
  vertical-align: middle;
  height: 48px;
  min-height: 48px;
  box-sizing: border-box;
  padding: 0 22px;
  line-height: 1.2 !important;
  text-decoration: none;
}

    .ab-secondary {
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      text-decoration: underline;
    }

    .ab-empty,
    .ab-loading {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 38px 20px;
      text-align: center;
    }

    .ab-empty-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .ab-empty h2 {
      color: var(--navy);
      font-size: 20px;
      margin-bottom: 6px;
    }

    .ab-empty p,
    .ab-loading {
      color: var(--muted);
    }

    .ab-book-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 164px;
      min-height: 48px;
      box-sizing: border-box;
      margin: 16px auto 0;
      padding: 0 22px;
      text-align: center;
      line-height: 1.2;
    }

    #activeBookingMessage:empty {
      display: none;
    }

    @media(max-width:650px) {
      .ab-details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ab-route strong {
        font-size: 14px;
      }

      .active-booking-card {
        padding: 16px;
      }

      .ab-passenger {
        flex-direction: column;
        gap: 3px;
      }

      .ab-passenger span:last-child {
        text-align: left;
      }
    }

    .booking-view-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0 20px;
    }

    .booking-view-tabs button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      padding: 9px 14px;
      border-radius: 20px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .booking-view-tabs button.is-active {
      background: var(--navy);
      color: #fff;
    }

    .booking-view-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: -8px 0 18px;
    }
    
    /* Move Travel History slightly closer to Booking Changes */
#bookingViewTabs > a[data-booking-view="travel-history"] {
  transform: translateX(50px);
}

  </style>
</head>

<body data-page="active-bookings" data-active="active-bookings">

  <div id="site-header"></div>

  <main class="wrap wrap-md section">

    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="book.html">Book a Journey</a>
      <span>&rsaquo;</span>
      <span>Bookings</span>
    </nav>

    <div class="active-bookings-head">
      <div>
        <h1 class="page-title">Bookings</h1>
        <p class="page-sub">
          View your booking status, manage payments, and keep track of your journeys.
        </p>
      </div>

      <div class="active-bookings-count">
        <span id="activeBookingCount">0</span>
        <span id="activeBookingCountLabel">active booking(s)</span>
      </div>
    </div>

    <div
      id="activeBookingMessage"
      class="notice notice-info"
      role="status"
      aria-live="polite">
    </div>

    <div class="active-bookings-tools">
      <input
        class="inp"
        type="search"
        id="activeBookingSearch"
        placeholder="Search booking reference, train, route or passenger..."
        aria-label="Search bookings"
      />

      <button
        class="btn-outline"
        type="button"
        id="refreshActiveBookings">
        Refresh
      </button>
    </div>

    
<div class="booking-filter-row">

  <div class="booking-view-tabs" id="bookingViewTabs" aria-label="Filter bookings by status">
    <div class="booking-status-filters">
      <button type="button" class="is-active" data-booking-view="all">All</button>
      <button type="button" data-booking-view="to-pay">To Pay</button>
      <button type="button" data-booking-view="to-confirm">To Confirm</button>
      <button type="button" data-booking-view="confirmed">Confirmed</button>
      <button type="button" data-booking-view="cancelled">Cancelled &amp; Expired</button>
      <button type="button" data-booking-view="refund">Refund</button>
    </div>

    <a href="#" class="travel-history-link" data-booking-view="travel-history">
      Travel History
    </a>
    <a href="booking-changes.html" class="travel-history-link">Booking Changes</a>
  </div>

</div>

<p class="booking-view-description" id="bookingViewDescription" aria-live="polite">
  All your bookings, regardless of status.
</p>

    <section id="activeBookingList" aria-live="polite">
      <div class="ab-loading">
        Loading your bookings...
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
