<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Review | JJCC Railways</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#102044;--gold:#d18408;--cream:#f5f3ee;--ink:#172440;--muted:#77766f;--line:#e5e3de}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--navy);color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:white;text-decoration:none;border:1px solid #ffffff66;padding:10px 14px;border-radius:7px}main{width:92%;max-width:1250px;margin:32px auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat,.panel,.receipt{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.stat span,small,.muted{color:var(--muted)}.stat h2{font-size:30px;margin:8px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,select,textarea{font:inherit;padding:11px;border:1px solid var(--line);border-radius:7px}button{font:inherit;border:0;border-radius:7px;padding:11px 16px;cursor:pointer;font-weight:700}.approve{background:#187443;color:white}.reject{background:#a52c2c;color:white}.open{background:var(--navy);color:white}.receipt{margin:14px 0;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.receipt p{margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions textarea{width:100%;min-height:60px}.status{padding:12px;background:#fff2d7;border-radius:7px;margin:14px 0}.error{color:#a52c2c}@media(max-width:700px){.stats{grid-template-columns:1fr}.receipt{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}</style></head><body><header><strong>JJCC RAILWAYS | PAYMENT REVIEW</strong><a id="dashboardLink" href="admin.html">Back to Dashboard</a></header><main><h1>Payment Receipt Review</h1><p class="muted">Review uploaded receipts and approve or reject pending payments.</p><section class="stats"><div class="stat"><span>All submissions</span><h2 id="allCount">—</h2></div><div class="stat"><span>Pending review</span><h2 id="pendingCount">—</h2></div><div class="stat"><span>Approved</span><h2 id="approvedCount">—</h2></div><div class="stat"><span>Rejected</span><h2 id="rejectedCount">—</h2></div></section><section class="panel"><div class="toolbar"><select id="filter"><option value="pending_review">Pending review</option><option value="all">All submissions</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button id="refresh">Refresh</button></div><p id="message" class="status" role="status">Loading…</p><div id="receiptList"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const URL='https://ocjyyfzuoiprwajwyize.supabase.co',KEY='sb_publishable_XZu8suOKCWB9Zp7dYhzxgQ_Yaq5zxo8';const db=window.supabase.createClient(URL,KEY),$=s=>document.querySelector(s);let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,e=false){$('#message').textContent=t;$('#message').className='status'+(e?' error':'')}async function init(){try{const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user){location.replace('index.html');return}const {data:role,error:re}=await db.rpc('current_user_role');if(re)throw re;if(!['admin','super_admin'].includes(role)){location.replace(role==='user'?'book.html':'index.html');return}if(role==='super_admin')$('#dashboardLink').href='superadmin.html';await load()}catch(e){msg(e.message||'Unable to load receipt review.',true)}}async function load(){msg('Loading receipt submissions…');const {data,error}=await db.from('payment_submissions').select('submission_id,booking_id,user_id,receipt_path,status,admin_note,submitted_at,reviewed_at,booking_reference,total_fare,travel_date').order('submitted_at',{ascending:false});if(error)throw error;rows=data||[];$('#allCount').textContent=rows.length;$('#pendingCount').textContent=rows.filter(x=>x.status==='pending_review').length;$('#approvedCount').textContent=rows.filter(x=>x.status==='approved').length;$('#rejectedCount').textContent=rows.filter(x=>x.status==='rejected').length;render()}function render(){const f=$('#filter').value;const shown=rows.filter(x=>f==='all'||x.status===f);$('#receiptList').innerHTML=shown.length?shown.map(x=>`<article class="receipt"><div><strong>Submission #${x.submission_id}</strong><p>Booking: ${esc(x.booking_reference||x.booking_id)} · Fare: ₱${Number(x.total_fare||0).toFixed(2)} · Travel: ${esc(x.travel_date||'—')}</p><p>User ID: ${esc(x.user_id)}</p><small>${new Date(x.submitted_at).toLocaleString('en-PH')} · ${esc(x.status.replaceAll('_',' '))}</small><div class="actions"><button class="open" data-open="${x.submission_id}">View receipt</button></div><textarea id="note-${x.submission_id}" placeholder="Optional reason or note for the user">${esc(x.admin_note||'')}</textarea></div><div class="actions">${x.status==='pending_review'?`<button class="approve" data-review="approved" data-id="${x.submission_id}">Approve</button><button class="reject" data-review="rejected" data-id="${x.submission_id}">Reject</button>`:''}</div></article>`).join(''):'<p>No receipt submissions in this filter.</p>';}
$('#filter').addEventListener('change',render);$('#refresh').addEventListener('click',()=>load().catch(e=>msg(e.message,true)));$('#receiptList').addEventListener('click',async e=>{const open=e.target.closest('[data-open]');const review=e.target.closest('[data-review]');try{if(open){const row=rows.find(x=>x.submission_id===Number(open.dataset.open));const {data,error}=await db.storage.from('payment-receipts').createSignedUrl(row.receipt_path,300);if(error)throw error;window.open(data.signedUrl,'_blank','noopener');}if(review){const id=Number(review.dataset.id),decision=review.dataset.review,note=$('#note-'+id).value.trim();if(!confirm(`Are you sure you want to ${decision} this receipt?`))return;review.disabled=true;const {data,error}=await db.rpc('review_payment_submission',{p_submission_id:id,p_decision:decision,p_admin_note:note||null});if(error)throw error;if(!data?.success)throw new Error('Review was not saved.');msg(`Receipt ${decision}. User notification has been created.`);await load();}}catch(err){msg(err.message||'Unable to complete this action.',true);}});init();})();
</script></body></html>
